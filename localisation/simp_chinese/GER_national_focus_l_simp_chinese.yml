 GER_contact_trapped_personnel_desc: ""
 GER_deploy_border_company_nine: "出动边防9连"
 GER_deploy_border_company_nine_desc: ""
 GER_stand_ready: "时刻准备着"
 GER_stand_ready_desc: ""
 GER_stabilize_the_home_front: "时刻稳住内部"
 GER_stabilize_the_home_front_desc: "法兰克福的硝烟刺激着所有人的神经，有人想趁虚而入，破坏我们得之不易的团结。现在我们必须时刻稳住内部，绝对不能让我们的国家分崩离析。"
 GER_partial_state_of_emergency: "部分紧急状态"
 GER_partial_state_of_emergency_desc: "边境的冲突愈演愈烈，为了国家的安全与稳定，是时候采取一些紧急政策了。"
 GER_city_travel_restrictions: "各城市限行"
 GER_city_travel_restrictions_desc: "前线的冲突仍在升级，我们需要部队能够更快地抵达作战区域。"
 GER_control_population_movement: "人口流动控制"
 GER_control_population_movement_desc: "我们被渗透了！越来越多的间谍开始在街上游荡，企图颠覆我们的国家！我们需要进一步限制人口的流动！"
 GER_guard_against_extremists: "提防极端分子"
 GER_guard_against_extremists_desc: "有些人开始蠢蠢欲动了，境内的部分冲突事件已经证明了这一点。极端分子们正试图挑战我们，我们需要时刻防止他们的阴谋。"
 GER_stasi_round_the_clock_surveillance: "史塔西全天候监视"
 GER_stasi_round_the_clock_surveillance_desc: "谣言，还有偶尔的骚乱让民众们本就紧绷的神经更加紧张。我们需要更多的人手来监视街道。"
 GER_arrest_the_uncontrollable: "逮捕不可控者"
 GER_arrest_the_uncontrollable_desc: "晒色！极端分子们终于露出了他们的马脚，是时候将他们一网打尽了！别管什么人权谴责了，因为他们正试图颠覆我们的国家！"
 GER_all_is_quiet: "平安无事"
 GER_all_is_quiet_desc: "一切都结束了，为了国家，为了人民，为了我们脚下这片深爱的土地，我们已经付出了太多太多。尽管这些会留下不少创伤，但一切都值得。"
