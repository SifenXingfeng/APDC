l_simp_chinese:
 GER_convene_peoples_chamber: "召开人民议会"
 GER_convene_peoples_chamber_desc: "人民议会和政治协商会议召开了步入60年代以来的第一次会议，自国家统一以来的历次会议都未有今天如此空前的规模，各党派代表在会议上充分坦率的交换了意见和当下面临的问题，我们相信这是有效解决国内日渐增多的矛盾的一个开端，也期望能以此稳定国内的政治局势。"
 GER_resolve_west_german_industries: "解决西德工企问题"
 GER_resolve_west_german_industries_desc: "燃遍欧洲的战火已经结束了近十年，然而世界大战和分裂的阴霾依旧笼罩在德国人民的头上，当初为了避免再生事端破坏和平，对西德的工企妥协同意保留私有化，但现在积攒了十年的矛盾开始浮出水面；一方面我们仍需要西德地区庞大的工业产能，但另一方面，西德工企留下的大量技术工人和管理人员不断抗议着各种问题，没能彻底消化掉西德地区的后果现在只能由我们自己承担。"
 GER_court_west_german_industries: "拉拢西德工企"
 GER_court_west_german_industries_desc: "为了缓解矛盾，我们决定对西德工企提供新一轮的资金支持，同时和拥有多数西德企业支持的泛欧党开始新的磋商，在一定程度上的妥协后换取他们的支持，为此承担一些其他党派扩张的风险是值得的。"
 GER_preferential_policies: "政策优待"
 GER_preferential_policies_desc: "政府的谈判代表被派出，新的税收标准被确定，政策上的优待和涌入的资金使西德的工企放下了戒备，开始拥抱流入的投资，但同时我们也需要面对国内一些不和谐的声音。"
 GER_government_industry_unity: "政企同心"
 GER_government_industry_unity_desc: "政企同心，以心相交，推动我们前进的不再是利益，而是更深层的，一直潜藏在我们血脉中的共识。"
 GER_substitute_the_goods: "偷梁换柱"
 GER_substitute_the_goods_desc: "俺寻思统一党是最waaaaagh的，他们的技霸和warboss更大更强，奥哥暴力又狡猾，罗哥狡猾又暴力，waaaaagh了德意志，我们应该把我们生产片砍和板斧的作坊给东边的技霸们，然后生产更waaaaaagh的片砍和板斧"
 GER_wait_for_the_opportunity: "伺机而动"
 GER_wait_for_the_opportunity_desc: ""
 GER_absorb_west_german_industries: "收编西德工企"
 GER_absorb_west_german_industries_desc: "不能再妥协了，也不能再让西德的余毒继续残害我们的人民，为了国家的未来，我们需要忍受变革时的阵痛，去承担一些必然的损失，最终在行政命令下，西德工企的国有化进程开始了。"
 GER_preserve_original_structure: "保持原构成"
 GER_preserve_original_structure_desc: "国有化面临的阻力使我们无法彻底根除扎根在工企中的反对势力，而与此同时其他的党派也借着反对的声音开始造势，为自己拉拢选票和支持，在愈发浩大的反对声之下我们不得不重新审视我们所制定的政策。"
 GER_win_over_the_workers: "拉拢员工"
 GER_win_over_the_workers_desc: "我们无法从他们的上层根除历史的余毒，但我们可以从下层拉拢我们真正的同袍，易北河很宽，宽到要架设德国最长的桥，易北河很窄，窄到无法阻拦东西河岸间工人的阶级友谊。"
 GER_business_as_usual: "公事公办"
 GER_business_as_usual_desc: "公事公办，一视同仁，民众认识到了政府将企业国有化的态度和决心，公正的判罚让支持的声音开始渐渐的盖过了反对者的意见。"
 GER_reorganize_state_enterprises: "新编工企"
 GER_reorganize_state_enterprises_desc: "国有化结束后，我们着手架设国营企业体系，尽管对全套的国营体系的假设仍在努力的尝试和探索，但是上下一心的乐观态度和卓有成效的初步尝试让民众对未来充满信心。"
 GER_reconstitute_original_entities: "原主体再构成"
 GER_reconstitute_original_entities_desc: "探索建立国营体系的经验对我们有着举足轻重的价值，在此之上我们计划建立真正的公有制经济——不仅仅是为了提升我们的生产效率，更是为了实现早已写入我们宪法中的最终理想，公有制下美好未来的前景激发着每一个德国民众对生产的热情，内部的分歧在明确的目标下被削减，弥合，我们将再次成为一个民族，一个整体，所有人心中都有了一个信念，为了我们的德意志，为了我们的明天。"
 GER_unite_east_and_west: "东西合拢"
 GER_unite_east_and_west_desc: "在建设国营体系之外，技术的进步也是我们所需要的发展途径，由政府牵头，东西德的企业和共和国科学院达成协议，组建了技术联合体，相互扶持，相互帮助，推动着我们的技术发展和生产效率，将技术加速头像运用，用发展来弥合曾经的分歧。"
 GER_modernize_army_equipment: "部队装备迭代"
 GER_modernize_army_equipment_desc: "在十数年的和平岁月里，我们的军事装备长期处于“马放南山”的状态；而十余年后的今天，国际局势风云诡谲，这些装备已到了更新换代的节点。当下，我们亟需明确未来装备的发展方向，确保有能力打赢未来可能发生的战争。我们必须重新回归厉兵秣马、枕戈待旦的战备状态，以应对任何潜在的战争威胁。"
 GER_full_domestic_production: "全面国产化"
 GER_full_domestic_production_desc: "我们将使用全新的国产化装备替代老旧的华约装备，全面国产化是德国的安全保障，我们不仅需要枪杆子，还要保证枪杆子不会被卡脖子，我们要将国防安全的命脉牢牢掌握在自己手中，而不仅仅是依赖某个强大的联盟"
 GER_independent_armaments_industry: "军工自主"
 GER_independent_armaments_industry_desc: "在世界大战的铁与血中，德意志的人民已经证明了实现德国军工自主的可能，我们完全可以独立生产我们自己的军事装备而不依赖其他势力，从研发到制造，从矿石到子弹，中间的每一个环节我们都要握在自己的手中，扩产装备，扩充研发，一切都是为了保障德国的安全，维护德国的利益"
 GER_extend_warsaw_pact_equipment: "华约装备延寿"
 GER_extend_warsaw_pact_equipment_desc: "华约集团赠予给我们的大量武器装备虽然已经落后，但并不意味着这些装备做不到可堪一用，他们的潜力尚未被发掘殆尽，对华约装备进行延寿改进和现代化改造是较低成本提升战斗力的办法，国内尚在改革，把太多资源投入到军工上有劳民伤财的风险，将旧有装备延寿继续服役是一个明智的选择。"
 GER_extend_existing_equipment: "现有装备延寿"
 GER_extend_existing_equipment_desc: "在华约盟友赠予的装备之外，人民军也继承了大量的前国防军装备，这些装备并没有完全落后于时代(服役了80年的狂风，60年的虎直，60年的HK416，50年的MG5，50年的G28，90年的HK512，80年的FIM92毒刺，60年的HK MP7,少前40K越古越强，这机魂是无比强大还是tmd死透了)，当年生产制造这些武器的工厂也尚在，在原有的技术上继续改进延寿这些前国防军装备是可行的，过去这些武器曾经对准了我们的同袍，而如今。他们将在人民军的手中对准我们真正的敌人"
 GER_old_blades_still_sharp: "宝刀不老"
 GER_old_blades_still_sharp_desc: ""
 GER_integrate_warsaw_pact_production: "整合建立华约生产线"
 GER_integrate_warsaw_pact_production_desc: "延寿旧有华约装备之外，我们在华沙条约的体系下建立新的装备生产线，统一整个华约军事装备，这样在未来可能的战争里，更强大苏联方面为我们提供的支持可以无缝交接，将德国的军事体系并入到华约的战争机器里，工人是民主德国战争机器的齿轮，而民主德国是华约战争机器上的齿轮"
 GER_blade_of_rus: "罗斯利刃"
 GER_blade_of_rus_desc: ""
 GER_visit_security_services: "慰问军警宪特部门"
 GER_visit_security_services_desc: "军警宪特部门，又称国家暴力机关，承担着守护共和国的光荣使命。古往今来，军权都是重中之重，可若没有利益许诺谁肯提着脑袋替你卖命？并不是说军队的思想建设就不重要，而是在这复兴阶段中我们要用最直接的方式给予我们军队强大的配得感，让他们能够免除后患之忧，守护好我们的共和国。"
 GER_reward_our_own: "给自己人甜头"
 GER_reward_our_own_desc: "然，嫡庶有别，尊卑有序。军队中那些支持我们的，有为国家做出更大贡献的，我们自然要许以重利，但并非说就要因此冷落其他人。事实恰恰相反，共和国的军队要拧成一股绳，在待遇上就要显得平等，这样才能让人无话可说。但是在具体操作上，我们可以进行一些细微调整。"
 GER_raise_benefits: "提高待遇"
 GER_raise_benefits_desc: "对于支持我们的人，除却必要的钱财和名声外，武器供给的优先倾斜也是必要的一环，这能够让他们从中体会到自己守卫国家的自豪感。我们新式的国产武器已整装待发，是时候将奖励发到他们的手中了。"
 GER_generate_additional_revenue: "额外创收"
 GER_generate_additional_revenue_desc: "军队不能经商，一旦经商便会导致严重的腐败。那么我们要如何增加他们的收入？我们或许可以让军队成立“生产建设兵团”的组织，农场、矿场这些都是战略物资的重要产出地，让他们去经略这些地方，国家给予形式补贴，这样也能减少一些军费开支。同时，我们还能够动员军队中的工程兵和铁道兵去帮助国家维修基建，使他们能够从中获益。"
 GER_optimize_benefits: "优化待遇"
 GER_optimize_benefits_desc: "既然我们想要做到一碗水端平，而国库又捉襟见肘的情况下，最好的选择就是对整体结构进行调整，我们可以从冗余的人员、项目、制度上入手进行精简优化，再把腾出的这些资源交到他们的手上，只要稳住了大队伍，反对派的声音便无足轻重。"
 GER_make_do_and_mend: "缝缝补补过日子"
 GER_make_do_and_mend_desc: "尽管说的美好，但实际上我们也没能从中节省出多少资源来，拆东墙补西墙的策略最多缓燃眉之急，相比于稳定而言，多付出的一些资源就显得无足轻重了。"
 GER_consult_warsaw_pact_colleagues: "和华约同事嘘寒问暖"
 GER_consult_warsaw_pact_colleagues_desc: "拆东墙补西墙的日子终究是只能解决眼前的问题，更加长远的问题急需解决。我们需要其他华约国家的支持，也需要团结起来寻找破局的钥匙。"
 GER_negotiate_new_aid: "商讨新一批援助"
 GER_negotiate_new_aid_desc: "我们终于等到了其他华约国家的来访，他们愿意为我们提供基础的物资援助。现在，我们需要敲定援助的细节。"
 GER_days_of_potatoes_and_cabbage: "土豆甘蓝的日子"
 GER_days_of_potatoes_and_cabbage_desc: "土豆、甘蓝……这是他们能给我们的最大的帮助。也许眼下的日子会非常艰难，但至少不会饿肚子了，我们有足够的时间来思考接下来的路。"
 GER_fire_in_the_east: "东边起火"
 GER_fire_in_the_east_desc: "波兰军事管制区的硝烟已经从华沙蔓延到了法兰克福，刚刚能喘过一口气的我们又将面临新的考验。我们能否挺过这一轮的冲击呢？"
