 orthodox_communism:0 "原教旨社会主义"
 orthodox_communism_desc:0 "即便是在共产主义者刚刚成功建立起属于自己的国家的20世纪，全世界的革命家们无一不面临着这样一个事实：马克思与列宁的思想不能完整地套用至自己的土地上。这或是因为时局的更替，或是因为当地某种无奈的现实。于是他们针对自己所面临的局面，充分发挥了主观能动性，创造出了这样或那样的“土豆炖牛肉”式共产主义。\n\n然而原教旨共产主义者并不认同这种变化，他们认为对时局的妥协无异于向魔鬼出卖自己的灵魂，而要在现实中真正建立一个幸福且可持续的共产主义乌托邦，就必须抵制这种诱惑。"
 red_military_government:0 "红色军政府"
 red_military_government_desc:0 "军政府往往因危机、政变与革命而上台。当文官政府与议会彻底失灵，无法掌控现状时，军队就有可能出手，以暴力手段强制国家的稳定，宣布宵禁，解散议会，暂停宪法，并承诺这一切只是暂时的，一旦秩序恢复，便还政于民，即使穿上了红色的马甲也依然如此。\n\n红色军政府依旧保留了传统左翼政党的组织方式和意识形态，乍一看这只是一个由党员们组成的军政府，如若剖开分析，其军政府成分远远大于意识形态成分，马甲什么颜色改变不了枪杆子决定笔杆子的实际执政，但执政者是否真的信仰其出身的意识形态还是将其作为实现野心的工具，那只能问执政者自己了。"
 left_eurasianism:0 "左派欧亚主义"
 left_eurasianism_desc:0 "列夫·古米廖夫，亚历山大·杜金等提出的欧亚主义放到21世纪60年代的今天仍然有不少追随者，苏联赢得三战带来的巨大影响助推传播了这一思想更“正确和进步”的那一部分。\n\n左翼欧亚主义既坚持传统的欧亚一体价值观，又秉持马克思列宁主义基本原理。经当今执政者的成功，结合其现实执政需求和国族认同需要，它从理论家的纸笔和口号成为了正式的执政纲领，开始了新的庞大的社会实验。"
 neo_strasserism:0 "新斯特拉瑟主义"
 neo_strasserism_desc:0 "新斯特拉瑟主义将激进反资本主义、民族动员和领袖政治重新包装为战后革命方案，敌视跨国金融与寡头企业，却保留高度集权和排他性的群众组织。"
 security_socialism:0 "安保社会主义"
 security_socialism_desc:0 "“老大哥在看着你”，现代社会实现1984式的全方位控制社会并不难，一套算法，一套计算机系统，两个极度担心失控的人，组成了这套安全网络的核心。\n\n马克思列宁主义的发展中经历了不少从抽象到具体的围追堵截，这物极必反地导致了执政层对“安全”的极大焦虑，从内到外，从语言到认知，如果掌握了这一切“不稳定因素”并收为己用，是否代表着掌握了过去，现实与未来，这是伊戈尔和罗密需要回答的终极之问。"
 technocratic_communism:0 "技官社会主义"
 technocratic_communism_desc:0 "技官共产主义依靠工程师、规划专家与计算系统分配稀缺资源，试图用可验证的生产和净化指标取代派系斗争，同时坚持关键设施归全社会所有。"
 military_political_communism:0 "军政社会主义"
 military_political_communism_desc:0 "在建立列宁式政党与先锋队的斗争当中，有一伙人选择了革命最直接也最为暴力的伙伴——士兵与军官们。\n\n诚然，掌握了国家暴力手段的士兵们并非建设共产主义国家的最优人选，但对于这世界上的很多国家与非国家政权来说，只有军队，只有经历了红色教育，政治可靠的军队能够保护革命的火苗，带领共产主义政党以继续存续。\n\n许多批评者认为摆在军政共产主义与军政府之间的，只有一条细细的丝线，而一昧地依靠军队，只会令国家在和平降临时，坠入万劫不复的深渊，然而，批判毕竟无法胜过武器。"
 left_wing_terrorism:0 "左翼恐怖主义"
 left_wing_terrorism_desc:0 "1969年，出于对越南战争与尼克松总统的愤怒，威廉·鲍威尔创作了饱受争议的著作《无政府主义厨房手册》，其中包含了一位意欲反对政府的暴力分子从制作炸弹到发动袭击所需要的一切，而就几乎在同一时间，日本全共斗运动的兴起，与一直持续的北爱尔兰共和军的城市游击战，彻底奠定了所谓“革命恐怖主义”的一切。\n\n左翼恐怖主义被大部分人认为是日本全共斗运动的进一步发展，特别是在当今新日本企业特区中的城市游击队猖獗的情况下，然而，这一以绝对的暴力手段对抗一切反革命分子与潜在反革命分子的行为，又不仅仅只能见于新日本，在美国二次内战时期，乃至于那些秩序崩乱的南美与非洲城市，都可见这些革命者引发的大爆炸。"
 frontier_communism:0 "边疆社会主义"
 frontier_communism_desc:0 "在一无所有之地，共产主义是否能够存在？\n\n与后稀缺社会理论家所思考的，在社会物质极大丰富时才可建设完成的共产主义不同，边疆共产主义，诞生于文明社会边缘的苦寒之地，与当地特有的气候、生态与社会稀缺做斗争。\n\n尽管边疆共产主义并未主动去选择边疆，但边疆已经与这些偏远地区的革命者水乳交融，形成了基于社群互助、社会生产以及多元平等的独特革命景观，边疆共产主义者相信，真正的革命并非等待丰饶降临，而是在一无所有之处，以彼此为资源，以团结为生产，从零开始建设一种足以抵御一切匮乏的社会形式。"
 anarcho_communism:0 "无政府共产主义"
 anarcho_communism_desc:0 "无政府共产主义主张由自治公社和互助网络直接管理生产与安全，反对国家、公司或军队垄断人形与基础设施，并要求人类和具备人格的人形平等参与共同体。"
 automated_communism:0 "自动化社会主义"
 automated_communism_desc:0 "自动化共产主义认为成熟的人形劳动、智能物流和无人生产能够消除匮乏，由公共算法协调生产与分配，使人类和人形摆脱被迫劳动与私人占有。"

 fundamental_fascism:0 "原教旨法西斯主义"
 fundamental_fascism_desc:0 "原教旨法西斯主义，正如其名，是最原始的法西斯主义。它的范式早在1933年希特勒被选举上台之前便已成形，甚至早于墨索里尼进军罗马——它是“第三道路”最原初的设想，是20世纪初那场席卷欧洲的激进民族主义浪潮最纯粹的结晶。\n\n它推崇极端民族主义，反对民主，反对君主制，主张以准军事武装作为政治斗争的核心工具，以领袖崇拜作为凝聚群众的最高形式。在原教旨法西斯主义者眼中，国家是血与土的自然延伸；领袖是民族意志的化身，民主是衰败的符号，自由是懦弱的借口，而只有铁的意志与血的牺牲，才能让一个民族在生存竞争中屹立不倒。"
 zionist_fascism:0 "锡安法西斯主义"
 zionist_fascism_desc:0 "锡安法西斯主义把民族家园的存续置于一切权利之上，以军事化定居、人口管制和强制统一回应污染、流亡与安全危机，并排斥多元政治对国家使命的限制。"
 neo_nazism:0 "新纳粹主义"
 neo_nazism_desc:0 "新纳粹主义继承种族等级、极端民族主义和扩张主义，以坍塌灾难后的生存竞争为其伪科学辩护，并企图用现代监控与自动化武装实现总体控制。"
 extreme_militarism:0 "极端军国主义"
 extreme_militarism_desc:0 "极端军国主义将国家内能正常运转的一切——经济、教育、医疗、农业、工业、文化——皆绑架于军队的战车之上。它不满足于让军队服务于国家，而是让国家彻底沦为军队的附庸。向外，它发动永不停歇的战争，以征服为唯一目的，以胜利为唯一合法性；向内，它压制一切异议，将任何对军事优先的质疑都视为对民族的背叛。\n\n在这一体制下，工厂生产的消费品最终都会化为武器，学校所培养的公民最终都会化为士兵，媒体所报道的新闻皆是战报，整个国家变成了一台因战争而生的机器，只有三种方式停下：自身的死亡，所有对手的死亡，战争骑士本尊的死亡。"
 military_political_fascism:0 "军政法西斯主义"
 military_political_fascism_desc:0 "军政法西斯主义建立于军队之上，与他们那些同样选择了军队的军政社会主义敌人一样，但又有很大区别。\n\n军队，这一掌握了暴力的伙伴天生便是崇尚将暴力施加予他者的法西斯主义的盟友。法西斯主义给予了军队以纪律、敌人与荣耀，而军队报之以忠诚、毁灭与战争，二者的结合不是偶然的政治联姻，而是在某种本质上的相互吸引。在军政法西斯主义治下，军装将成为社会阶级最高层的代表，对暴力的狂热将会灌输于每一位合法公民的心中。\n\n于是，那就令战争开启吧，因为汝之荣耀即忠诚。"
 criminal_state:0 "罪犯国度"
 criminal_state_desc:0 "人们总是敌视反乌托邦，但老大哥们总是一遍又一遍地重复：最坏的秩序总好过没有秩序。而犯罪国度正是如此，在这里，犯罪集团便会代替政府，确立起属于他们的统治。\n\n或者说，这里并非没有秩序，只是这秩序独属于黑帮、毒枭、地下军火商、黑诊所与洗钱网络，他们通过恐惧与血税，维持着大多数民众的沉默。在这里，世界似乎又回到了它最原本的状态，弱肉强食，适者生存。"
 co_governance:0 "共治主义"
 co_governance_desc:0 "共治主义是广泛流行于西语国家的一种意识形态统称，其内涵因国而异，却共享若干鲜明特征：强人政治、国家宗教与道德准则的强调，以及对阶级调和的实践。它大体上可参考康乃馨革命前的葡萄牙——一个由强人领袖统摄全局、以宗教道德为社会黏合剂、试图在资本与劳工之间维持一种自上而下之平衡的体制。\n\n共治主义者主张，国家的使命不是站在某一阶级一边，而是作为超越性的家长，平衡一切矛盾。强人领袖被视为这种平衡的人格化象征，是被历史召唤来守护国家统一与道德秩序的人物。在其治下，教会享有尊崇地位，家庭被视为社会基石，而一切激进的政治实验——无论来自左翼还是右翼——都被视为对有机和谐的威胁。"

 anarcho_technocracy:0 "无政府技官主义"
 anarcho_technocracy_desc:0 "这种诡异的思想源流糅合了克鲁泡特金互助论与21世纪技术开源运动，提出通过分布式技官节点实现去国家化的社会自治。其运作机制依托基层单元自主治理与物物交换体系，中央仅保留跨单元协调职能。相比常见的无政府主义，其理论体系不拒绝组织，不拒绝理性权威，不拒绝规模，转而要求技术去暴力化、专家草根化与资源反稀缺化。\n\n尽管技官无政府主义者宣称自己也是安娜其妈妈最喜爱的孩子之一，并且是庞大的无政府主义家族中最可能实现的那一个，但就绝大多数的安娜其理论家来说，这绝非他们的族类。"
 bolivarianism:0 "玻利瓦尔主义"
 bolivarianism_desc:0 "玻利瓦尔主义将拉丁美洲的民族独立、区域团结与社会改革结合起来，主张以公共主导的经济和群众政治抵抗外部控制，并推动各国在平等基础上开展合作。"
 christian_socialism:0 "基督教社会主义"
 christian_socialism_desc:0 "“如果耶稣生活在现在，他一定是一位游击队员。”\n\n基督教社会主义支持者认为，基督教诞生早期所记载的早期基督徒在《旧约》与《新约》的指引下所建立的和谐社会，以因行称义，杜绝傲慢、嫉妒、贪婪、暴食等当代资本主义常见特质，实际上完成了社会主义最早期的探索与乌托邦的建立。\n\n故而，基督教社会主义者同时高举镰刀、锤头与十字架，以至仁至慈的上帝之名，或以劝导，或以暴力，誓要消除人类本原的罪恶。"
 left_nationalism:0 "左翼民族主义"
 left_nationalism_desc:0 "左翼民族主义把民族独立与社会所有制结合起来，反对外国军队、跨国企业和私人军事承包商控制本国安全区及净化资源。"
 left_revivalism:0 "左翼复兴主义"
 left_revivalism_desc:0 "左翼复兴主义认为旧世界已随北兰岛灾难和大战终结，必须通过激进平等、公共动员与新型人形劳动制度实现文明的第二次诞生。"
 market_socialism:0 "市场社会主义"
 market_socialism_desc:0 "市场社会主义允许合作社和公共企业在受监管市场中竞争，但土地、净化设施、核心算法与人形基础工业不得成为少数寡头的永久财产。"
 syndicalism:0 "工团主义"
 syndicalism_desc:0 "工团主义本有可能成为全世界社会主义运动的另一种选择，至少在德国输掉一战之前，确实如此。\n\n与先锋队式社会主义不同，工团主义者明确地拒绝国家机器的介入，而是寄希望于团结工会的直接行动，以工会作为革命的主体与社会架构的基本单元，通过罢工与社会运动乃至于工人武装斗争的方式，在不建立社会政权的前提下建设社会主义。\n\n尽管为主流目光所忽视，工团主义仍然以各种方式留存于每一个饱受政治机器压迫的工人心中，直至这个世界最终再无国家，亦无压迫。"
 popular_front:0 "人民阵线"
 popular_front_desc:0 "在许许多多的地方，阶级敌人的反动势力过于强大，而左翼革命组织的力量又过于分散，此时，人民阵线便会形成。\n\n人民阵线是一张涵盖所有以人民平等为核心，力图增进普罗大众福祉，并愿意为之付出包括生命在内的一切政党与组织的“大帐篷”，在人民阵线之内，各路左翼组织乐意于暂时搁置分歧，合力向某一目标前进，但当目标达成之后，人民阵线又很容易因为内部的各路争端而土崩瓦解。但此时，人民阵线也便完成了它的历史使命，即便反动派趁内斗卷土重来，亦有新的人民阵线会给予它们迎头痛击。"
 indian_communism:0 "南亚次共产主义"
 indian_communism_desc:0 "印度共产主义把土地改革、反种姓压迫、村社自治和公共工业化结合起来，试图在巨大人口压力与污染迁徙中建立适合南亚社会的社会主义道路。"

 frontier_progressivism:0 "边疆进步主义"
 frontier_progressivism_desc:0 "不同于边疆共产主义，边疆进步主义者往往不和政权当局敌对，作为一种独特的社会政治思潮，其思想谱系虽常被追溯至北美西进运动，但其理论内核早已严格摒弃了早期扩张中对原住民进行系统性剥夺的野蛮行径，而将“边疆”重新定义为一种纯粹的客观物理空间。其核心主张在于，文明福祉的增进不应依赖对既有存量财富的激烈再分配与阶层对抗，转而应诉诸于对“文明线”以外未利用土地的科技化改造与集约化开垦，通过几何级数地扩大有效国土面积来满足本地居民因人口增长与工业发展而日益高涨的生产生活需求。"
 left_populism:0 "左翼民粹主义"
 left_populism_desc:0 "左翼民粹主义把普通民众与难民描述为重建国家的真正主体，反对绿区寡头、腐败承包商和脱离监督的官僚，但仍依靠选举争取权力。"
 democratic_socialism:0 "民主社会主义"
 democratic_socialism_desc:0 "民主社会主义通过议会、选举和独立工会推动社会所有制与福利改革，拒绝以永久紧急状态为理由取消政治竞争。"
 humanitarian_capitalism:0 "人道资本主义"
 humanitarian_capitalism_desc:0 "人道资本主义的支持者认为，古典经济学所信奉的“涓滴效应”在现实中往往站不住脚——财富并不会自动从顶端渗入底层，反而常被各种资本手段截留。\n\n因此，人道资本主义主张，资本应主动承担社会契约中的道义责任，为那些不幸滑落至社会最下层的民众，构筑一道切实的安全网，提供住房、教育、医疗以及基本生活保障。\n\n这一思潮反对无政府资本主义式的丛林法则，但亦反对福利国家的无限制扩张，对于他们来说，或许在这之中以良知寻找平衡点，才是社会可持续发展的必要之举。"
 left_agrarianism:0 "左翼农业主义"
 left_agrarianism_desc:0 "左翼农业主义深深根植于土地与粮食，视保证劳动者能够平等且充裕地享有这二者为基本的社会正义，而非令土地与粮种成为资本残酷循环中的一部分。\n\n左翼农业主义者通常与社区自治、地方工团运动结盟，反对大型农业集团对土地的掌握。他们不必然敌视既有政权，但强烈要求国家将农业补贴转向家庭农场与生态保育，并适时地发动土地改革并修改土地法规，以确保土地兼并不再发生，或至少很少发生。"
 great_plains_rossartrism:0 "大平原罗克萨特主义"
 great_plains_rossartrism_desc:0 "大平原罗克萨特主义是罗克萨特主义与第二次西进运动的产物，相较于传统的罗克萨特主义，这种意识形态更注重于清洁开发污染区并为当地民众与聚落提供干净的水源、食物、住房等基本生活需求物资。\n\n或许有人会将这种意识形态与边疆进步主义或边疆共产主义相比较，它们不同之处在于，大平原罗克萨特主义运动不仅仅是一场向文明边缘地带进军的运动，而是要联合人类世界一切能够联合的力量，力图抹除自2030年北兰岛事件以来遗迹污染对人类的影响。"

 populist_conservatism:0 "民粹保守主义"
 populist_conservatism_desc:0 "民粹保守主义者宣称自己站在群众的这一方，高举秩序、传统与道德常识大旗，将“精英”置于“人民”的对立面，认为自由主义的精英建制已严重脱离本土民众的实际生活，并时刻威胁着国家主权、传统家庭结构与共同体的道德根基。\n\n民粹保守主义往往支持适度的贸易保护与社会福利，但前提是这些福利必须严格保留给“本土合法居民”，而非给予当地居民圈层之外的那些“他者”。"
 middle_way:0 "中间路线"
 middle_way_desc:0 "中间路线一种基于历史经验的审慎政治哲学。它承认变革的必然性，但坚信真正的进步只能通过渐进的调谐得以实现。其核心在于维护社会连续性——在传统与现代之间、在资本与劳工之间、在自由与秩序之间，寻求那条险窄而必经的平衡之道。\n\n中间路线的理论家深知，自己注定会被左右两翼的狂热分子共同唾弃。然而，他们坚信，国家这艘航船若要穿越风暴，既不能任由激进的舵手急转航向，也不可固执地抛锚停航，唯有做到如此，方才算不愧对自身所承担的责任。"
 traditional_patriotism:0 "传统爱国主义"
 traditional_patriotism_desc:0 "传统爱国主义将民族历史、家庭伦理、宗教习俗与国家忠诚视为社会凝聚力的根基，主张以保守改革和公民义务维护共同体，反对以激进革命割裂传统。"
 right_revivalism:0 "右翼复兴主义"
 right_revivalism_desc:0 "右翼复兴主义把战后衰败归因于旧精英的软弱，试图借助民族传统、宗教伦理、纪律和私人企业重建一个强健而统一的社会。"
 oligarchic_liberalism:0 "寡头自由主义"
 oligarchic_liberalism_desc:0 "寡头自由主义主张使政治权力应当与资本权力深度融合，并由少数掌握核心资源与信息优势的工业、金融及科技寡头，主导国家的发展方向。\n\n尽管被冠以自由之名，但寡头自由主义的所谓自由实则应打上个双引号，他们认为普通民众缺乏足够的理性与专业知识来参与复杂的政治与经济决策，令民主选举往往沦为短期利益的角斗场，故而，他们选择以高效治理的名义，将自身的意志以资本为载体贯彻至整个国家。"
 liberal_corporatism:0 "自由法团主义"
 liberal_corporatism_desc:0 "自由法团主义既非革命也非反动，其支持者期望于在个人自由与集体协作间寻求平衡的改良思潮，在资本主义与集体主义之间具体争议中寻找动态妥协，开辟一条以行业自治为核心的渐进改良道路，其核心机制是通过工人、雇主与消费者代表的平等谈判，制定行业规则、最低工资与培训标准，将劳资博弈转化为制度化的正和博弈，并在政治上倾向分权，将部分治理职能下放给行业议会与协调委员会，由技术专家和从业者共同决策，避免国家被单一集团俘获。"
 christian_conservatism:0 "基督教保守主义"
 christian_conservatism_desc:0 "基督教保守主义根植于传统的基督教价值观，其核心理念在于，国家与社会必须根植于基督教的家庭伦理、公义准则与爱国情操之上。教堂与牧师不仅是信仰的灯塔，更是凝聚社区、抵御世俗洪流的堡垒。\n\n在基督教保守主义者看来，21世纪的互联网革命催生了碎片化的虚无主义和去道德化的激进思潮。这些后现代异端思潮危害远超20世纪自由主义与共产主义的公开反叛，因此，当前的时代使命便是回归神圣经典，在牧者的引领下，重建以神为本的社会有机体。"

 progressive_liberalism:0 "进步自由主义"
 progressive_liberalism_desc:0 "进步自由主义者致力于建立一个以宪政民主、市场正义、文化多元和理性治理为基石的理想社会，这并非某一时代的产物，从费城到巴士底狱，进步与自由形成了一条贯穿现代史的精神谱系，而高举这面旗帜的他们，自认总是站在历史正确的那一方。\n\n在他们看来，一切试图为既有秩序辩护的保守力量，无论披着宗教外衣还是民族主义斗篷，都是进步道路上的绊脚石。他们坚信，只要给予每个个体充分的自由与平等的起点，人类终将在理性的指引下抵达完美的彼岸。"
 constitutional_liberalism:0 "宪政自由主义"
 constitutional_liberalism_desc:0 "宪政自由主义者相信，自由是人类与生俱来的权利——但这份权利必须被书写、被解释、被守护，因此，自由必须经由宪法这一人类智慧的结晶来赋予形态、划定边界。\n\n在宪政自由主义的治理下，国家描下了一道不容僭越的细细红线。在此线以内，思想、言论、信仰与财产皆享有绝对的自由空间；在此线以外，一切权力皆须受到宪法的严格约束，不存在任何基于行政便利或精英判断的独立裁量权。"
 anarcho_capitalism:0 "无政府资本主义"
 anarcho_capitalism_desc:0 "无政府资本主义曾不过是科幻小说家与自由意志主义者的反乌托邦戏言，然而，当大众传媒、加密资产、私人安保公司与仲裁机构开始取代人们生活中那些政府机构本该提供的日常职能——人们愕然发现，这场思想实验正在以前所未有的速度照进现实。\n\n该意识形态的核心信条极为简洁：一切服务皆可私有。它反对任何形式的强制性集体权威，将国家本身视为最大的暴力垄断组织与敌对公司，并确信，当私有化的替代方案足够高效时，国家将如同马车匠与电报员一样，被历史悄然淘汰。"
 liberal_conservatism:0 "自由保守主义"
 liberal_conservatism_desc:0 "自由保守主义这个看似自相矛盾的词汇其实蕴含了无数的政治妥协与渐进改革，它揭示了一个常被二分法蒙蔽的人从未看到过的视角：保守并不意味着顽固地固步自封，进步也不意味着轻蔑地舍弃传统。\n\n这一意识形态承认社会演进的规律，认为变革应当如树枝与树叶一样缓慢生长。自由保守主义者可能是虔诚的保守派，却愿意在民众普遍呼求的领域推动缓慢而审慎的改革；他们也可能是热忱的进步派，却在某些根本问题上坚守不可退让的底线。"
 liberal_technocracy:0 "自由技官主义"
 liberal_technocracy_desc:0 "在现代的传统语境中，自由主义与技官主义似乎天然相斥，一者是技术精英自上而下地规划一切，而另一者相信自发秩序与个人选择。然而，自由技官主义正是要在这看似不可能中寻找可能，相信技术治理可以服务于自由的目的，而非取代自由本身。\n\n这一意识形态汲取了20世纪欧美国家治理范式的经验与教训，并重新发掘了霍华德与沙里宁的规划思想的生命力。在其蓝图中，城市是由一个个专业、多元且相互依赖的居住区有机组合而成的生态网络。每个社区拥有自身的产业特色、文化气质与治理重心，却又通过高效的交通与信息纽带彼此联结。"

 constitutional_rossartrism:0 "宪政罗克萨特主义"
 constitutional_rossartrism_desc:0 "发生在2053年的内战撕裂了旧美国的国家政治机器，然而旧美国的诅咒似乎从未离去，新的罗克萨特主义政党执政八年，却发现自身似乎又一次陷入了两党制的泥潭。\n\n宪政罗克萨特主义者对内主张通过合作、谈判、协商等方式，以渐进的改革将美国罗盟的政治主张注入旧联邦留下的国家体制。对外主张“理想联盟”，即不急于构建以美国罗克萨特主义思想为基础的新秩序，而是试图融入现有的国际秩序，优先通过经济合作、文化渗透、渐进式整合等相对柔和的手段建立联盟所需的稳固基础，同时愿意为罗克萨特主义的长远目标牺牲部分短期的美国罗盟利益。"
 south_american_rossartrism:0 "南美洲罗克萨特主义"
 south_american_rossartrism_desc:0 "罗克萨特先生生前并未对他自身的理论进行过任何系统性的总结，故而，全世界的罗克萨特主义都在以自身的方式蓬勃，或是野蛮地自由生长。\n\n建立于21世纪40年代末的罗克萨特主义南美局所秉持的南美洲罗克萨特主义诞生自后拉丁战争与新日本城邦的现实，与那些迷信于中央强硬统治的北美洲与欧洲同志不同，他们认为在这片属于马孔多的大地上，意识形态、种族、文化以及阶级的冲突，需要放入一个更加容得下“自由呼吸”的空间。"
 broad_rossartrism:0 "广泛罗克萨特主义"
 broad_rossartrism_desc:0 "也许从来便没有“广泛罗克萨特主义”这一说法，只因这所谓的“广泛”是最为本源的罗克萨特主义未经发展，或是污染的理念的集合，只忠于罗克萨特先生生前最核心的信念：人类若要存续，便必须团结。\n\n在罗克萨特主义者看来，20世纪与21世纪的一切灾难——战争、饥荒、瘟疫、生态崩溃——其根源无不是人类政治共同体的分裂与内耗。民族、阶级、宗教、资本、仇恨，人类将最精密的智慧用于相互毁灭，却将最紧迫的共同威胁置若罔闻。他们的答案简洁而决绝：全世界应当团结于一个强而有力的统一政府之下，除此之外，皆是歧路。"
 corporate_council:0 "企业委员会"
 corporate_council_desc:0 "并非隐喻，也绝非预言，在这个前途未卜的世界中，赛博朋克化为现实，而且更加现实。\n\n在企业委员会制下，企业代替了政府的所有基本功能，当然，在一些地区，名义上的政府依然存在，宪法依然陈列在博物馆的玻璃柜中，国旗依然在政府大楼前飘扬——但坐在议会大厅里的，不再是选民选出的代表，而是各大企业的授权代理人，或许这本就是他们的样子。\n\n与无政府资本主义不同的是，企业委员会尚且保留有最后的理性，他们乐意于用一点微不足道的利益去讨好大众——廉价的娱乐、基本的医疗保障、不至于饿死的配给券。\n\n毕竟当最后一点光芒都失去时，燎原的怒火，就将会吞噬一切。"
 non_dominant_system:0 "无支配体制"
 non_dominant_system_desc:0 "无支配体制位于民主与专制之间，通常拥有某种形式的民主——议会、选举、政党、宪法，一应俱全。然而在现实操作中，这些名义上的自由、法律与选举，会以各种或明或暗的缘由让位于国家的最高统治者：战时状态、紧急法令、国家安全、社会稳定，理由永远充足，程序永远合法。\n\n但无支配体制与真正的专制之间，仍有一条线将其区分，那就是民主依然存在。民众仍然能够通过投向其他党派的方式，给予政府实实在在的压力。哪怕选举最后结果早已注定，真正的结果也早已众人皆知。"
 guardian_authoritarianism:0 "监护式威权主义"
 guardian_authoritarianism_desc:0 "监护式威权主义声称民主体制尚不足以应对污染和重建危机，由自命为监护者的精英暂时代行政治权利，并以未来恢复正常秩序作为合法性来源。"
 sharia_democracy:0 "沙里亚民主"
 sharia_democracy_desc:0 "沙里亚民主或是属于伊斯兰教的基督教民主，只不过他们禁绝崇拜偶像，法律也由千年以前的先知而非现代政治家写下。\n\n在沙里亚民主的治下，熟读经典的教士同时也是政治家与法官，并在某些程度上与世俗领主深度结合。他们往往凭借伊斯兰教法治理国家，并被反对者指责是完全的保守与反动，但在某些情况下他们并不反对进行一些微弱或不那么微弱的改革，以顺应这个变化地越来越快的世界。"

 absolute_monarchy:0 "绝对君主制"
 absolute_monarchy_desc:0 "溥天之下，莫非王土。\n\n当灵性的火焰驱散蒙昧的旧夜，将人们的影子映在岩洞之上时，一个问题就产生了，由谁去领导？由谁去统治？君主制的历史开启于人类最早期的岁月，当此之时，王与神同岁，而匍匐在其脚前的民众并不能区分二者的区别。\n\n绝对君主制将国家的全部主权凝缩于一顶王冠之下。君主不仅是政治的顶点，更是法律的本源、军队的统帅与信仰的守护者。君主是国之君父，臣民是国之臣子，国家的兴衰系于一人之德行与智慧。官僚、军队与教会皆为王权的延伸，议会即便存在，也不过是王座前的咨询机构。\n\n正如路易十四所述：“朕即国家。”"
 theocracy:0 "神权制"
 theocracy_desc:0 "神权制脱胎于古老的部落异教信仰——当先民们在雷电与丰收之间窥见神明的意志，祭司便成了最早的王。而丕平献土则开启了这一制度的新高峰：世俗的剑为神圣的钥匙让路，教权从此不再寄居於王座之侧，而是端坐于王座之上。\n\n直至今日，世界上仍有部分国家坚持着这一神圣的制度。他们以宗教领袖为权力核心，并崇拜着这样或那样的神明——无论是亚伯拉罕诸教的独一真神，还是古老万神殿中某位守护一方的尊主。在神权制的治理下，法律是神法的延伸，统治者是神意的代言，而民众的服从则是对神明的敬畏。\n\n溥天之下，唯主是依。"
 military_state:0 "军队国家"
 military_state_desc:0 "与军政府不同，军队国家是军队本身成为了国家机器，或可参考普鲁士，即：不是一个拥有军队的国家，而是一只拥有国家的军队。\n\n军队国家出现于军队脱离文官掌控的时刻：无论这支军队驻扎在本国领土还是异国他乡，它都以自身的暴力为唯一合法性来源，建立起一套以军事逻辑为核心的统治秩序。在其治下，军队经常是普通民众的唯一出路。\n\n军队国家往往不满足于自给自足，它系统地将自身的暴力能力商品化，向任何出价者出售保护、威慑与征服。"
 transitional_government:0 "过渡政府"
 transitional_government_desc:0 "战争、政变与革命，无论其旗号多么崇高，首先带来的总是秩序的崩塌。当旧有的权威烟消云散，当前线的炮火尚未停歇，而教师不知薪水从何而来、医生不知药品何处可寻、农民不知田野是否安全、工人不知机器为谁运转——此时总得有人站出来。\n\n过渡政府并非是某种意识形态，其使命也非重塑这一个国家。他们要成为的是这个国家的看守，令这个国家得以活到秩序再度降临的那一天。\n\n而秩序由谁给予？又何时降临？谁也不知道。"
 military_junta:0 "军政府"
 military_junta_desc:0 "军政府往往因危机、政变与革命而上台。当文官政府与议会彻底失灵，无法掌控现状时，军队就有可能出手，以暴力手段强制国家的稳定，宣布宵禁，解散议会，暂停宪法，并承诺这一切只是暂时的，一旦秩序恢复，便还政于民。\n\n很少能有人真正抵制权力的诱惑，于是，原本承诺的过渡期一再延长，原本临时的委员会变成了永久的执政团。然而，历史也并非全然黑暗——如辛辛纳图斯那样的人确实存在：从田垄间被召唤来拯救罗马，又在危机解除后卸下独裁官之职，回到自己的犁前。\n\n所以，你是做辛辛纳图斯，还是要做凯撒？"
 right_technocracy:0 "右翼技官主义"
 right_technocracy_desc:0 "有些幻想立足于未来，而还有些幻想超越了时代。在右翼技官主义之治下，社会全景监狱、大规模监控网络、社会信用评级——这些似乎只存在于《1984》与《美丽新世界》中的幻想，已经成为每日的现实，成为了敌托邦。\n\n右翼技官主义将技术理性与传统等级秩序熔于一炉，以最精密的技术手段维系着最古老的权力结构——精英统治大众，技术服务于秩序，而秩序本身便是目的。在这一体制下，每一个人都只是一颗棋子，一枚砝码，一具有用的趁手工具，以及一具用于超越现实的身躯。"
 command_technocracy:0 "指令技官主义"
 command_technocracy_desc:0 "指令技官主义源于上世纪末东德的政治体制与苏联OGAS系统实验的最初遗产，并着重加强了其中技官主义的维度。他们曾经努力过，而这些努力在各自的年代因技术局限而折戟，却为后世留下了一份清晰的蓝图：一个以唯一指令来源为大脑、以下级节点无条件服从为神经、以实时反馈为血液循环的庞大有机体。\n\n而今，得益于人工智能技术的进步，这一设想终于化为可能。中央控制核心不再依赖层层上报的滞后数据与人为篡改的报告，而是通过分布在每一个地方的实时反馈节点，全天候接收国家的脉搏。指令从核心发出，中间不存在质疑、拖延，与所谓灵活变通，只有执行，反馈，与中央指令下的调整。而只有当一个国家的全部资源、全部劳动力、全部智慧都被统合为一个单一意志的延伸时，人类才真正战胜了混乱。"
 guided_democracy:0 "指导式民主"
 guided_democracy_desc:0 "因民众力量非常，能掀起滔天巨浪，故而需得民主；因民众愚昧无知，会自我灭亡，故而需得指导。指导式民主的支持者如此认为，正如父母为幼子选择学校，正如医生为病人选择疗法，正如领航员为船只选择航线——民众需要的不是被剥夺选择权，而是被引导至那个唯一正确的选项，这便是指导的意义。\n\n在指导式民主的治下，民众将会做出选择，而一切民主的形式都被虔诚地保留。然而，早在这之前，上层的管理者就已经替代他们做出了选择，以确保人民那能摧毁一切的力量不会在黑暗中盲目挥舞。"
 league_authority_rossartrism:0 "盟权罗克萨特主义"
 league_authority_rossartrism_desc:0 "发生在2053年的内战撕裂了旧美国的国家政治机器，然而旧美国的诅咒似乎从未离去，新的罗克萨特主义政党执政八年，却发现自身似乎又一次陷入了两党制的泥潭。\n\n盟权罗克萨特主义者对内主张以集中权力的方式，迅速废除旧联邦时代的治理架构，从而以美国罗盟的政治主张为基础，通过激进的改革建立全新的国家体制。对外主张以政治干预、军事干涉等激进方式输出美国罗盟版本的罗克萨特主义理念，从而在全球罗克萨特主义运动中占据话语权，并掌握世界政治上的主导地位，由此将日后可能建立的世界级罗克萨特主义联盟提前布局为“美国的罗联”。"
 national_authoritarian_integralism:0 "民族威权统合主义"
 national_authoritarian_integralism_desc:0 "民族威权统合主义把国家描述为超越个人和阶级的有机整体，要求地方、行业、军队与人形组织接受统一等级秩序及民族使命。"

 esoteric_theocracy:0 "密传神权"
 esoteric_theocracy_desc:0 "造物主并非是仁慈的，相反，祂只给予了一部分选民逃脱末日，为天国的最终目标献身的机会。通往这一不可言明的大计划之通路遍布荆棘与鲜血，但对于信徒们来说，那永恒的痛苦不过一瞬，而那一瞬的喜悦恰似永恒。`\n\n密传神权建立在脱离主流宗教体系之外的教会当中，其隐秘性质确保了教会的外部安全与内部的血脉纯正。他们蛰伏在阴影之中，操控着自己的傀儡，以帮助教团展现其神明的意志。"
 esoteric_despotism:0 "密传专制主义"
 esoteric_despotism_desc:0 "宇宙遍布造物主留下的秘密，而只有最虔诚与最勇敢者才能得到造物主的期许。无论这将付出多少牺牲，也无论这些鲜血流向何方，被神所选中的人将会得到一切，就如同一切开始的开始与一切终结的终结时所预定的那样。\n\n密传专制主义拥有一套独树一帜的世界观与方法论，在他们眼中，世间的一切皆建立在伟大者的应许之下，皆是那些应许之民本当获得的，而眼下的失败皆是大敌的阴谋，唯有在先知的治下破除这些阴谋，应许之民才得以找回自己的身份。"
 mysticism:0 "神秘主义"
 mysticism_desc:0 "正如日神之秩序与酒神之放纵决定了社会的边界，人类的边界也在理性与感性之间徘徊，那些古老的，曾被崇拜，又被弃之如敝屣的存在，在这样的时代又一次在人的无意识之海中苏醒，如林地中的蛾茧一样躁动。\n\n每一次对那样存在的审视最终都巩固了存在的存在，每一次使用奥卡姆剃刀的尝试最终都会扩大存在的领域，因为存在正是存在，就像阳光与火焰一样永恒。\n\n接下来，我要讲一个人类使用火的故事。"

 national_bolshevism:0 "民族布尔什维克主义"
 lukashenko_thought:0 "卢卡申科思想"
 pragmatic_socialism:0 "务实社会主义"
 bolivarian_rossartrism:0 "玻利瓦尔-罗克萨特主义"
 scientific_technocracy:0 "科学技官主义"
 classical_socialism:0 "古典社会主义"
 national_bolshevism_desc:0 "“苏联民族”，这个概念从未被归纳为完整的国族认同，苏维埃社会主义共和国联盟这一围绕意识形态诞生的国家从1922年建立伊始到21世纪60年代初仍然缺乏一套完整的国族认同理论来凝聚国内团结。\n\n民族布尔什维克主义坚信:一套完整的自上而下的苏联民族共同体理念可在不违反马克思列宁主义基本原理的前提下发展出适合自身执政需求和促进国内团结的民族观。在国内，它将苏联境内所有民族凝练成一个共同体，打破传统民族划分确保不会出现新的分裂主义;在国外，它将四面出击，随着外交的言辞让这套价值观占领新的舆论阵地让敌人们无从下手。"
 pragmatic_socialism_desc:0 "“实践是检验真理唯一标准。”一切理论都需要在实践中接受检验，并结合实际状况并调整。本本主义，教条主义等已经给这片土地带来了足够的教训。\n\n该主义认为，社会主义是一条需要持续走下去的路——在条件允许的范围内，通过具体的行动来检验每一个理论，回应每一个问题，脚踏实地一步一个脚印。\n\n这一主义厌倦空洞的理论争论，拒绝接受所谓无须验证就能成立的理论，不盲从固定模板，不把任何方法奉为永恒的标准。"
 bolivarian_rossartrism_desc:0 "在南美洲，罗克萨特主义从未只有一副面孔。比起自由、多元的南美洲罗克萨特注意，另有一支更为炽热、更为决绝的支流，将罗克萨特先生关于人类团结的构想，与玻利瓦尔两百年前未竟的解放之梦熔于一炉，并吸收了后继从丰塞塔到格瓦拉这一长串为南美解放而献身的先驱者的鲜血与理想。\n\n玻利瓦尔-罗克萨特主义者坚信，欲得拯救者，必先自救，解放世界之前，必须先解放自己，南美洲的苦难从来不是孤立的，是民遗产、帝国干涉与本土寡头共同编织的枷锁，而打破这一枷锁的唯一道路，便是将整个大陆重新团结为一个强而有力的政治实体。\n\n而马孔多也将不再下雨。"
 scientific_technocracy_desc:0 "科学技官主义不关心自由与专制的区分，不参与民主与威权的辩论，不对稳定与变革表态。它只思考一件事情：让懂得工作的人工作，并让这套系统延续下去。\n\n在那些“真正的技官”眼中，人类历史上绝大多数政治争论都是无谓的噪音。左派与右派争夺的是谁来分配，民主与专制争夺的是谁来决策，而真正决定文明存续的，从来是那些具体而沉默的知识——如何让电网不崩溃，如何让疫苗被制造，如何让粮食从土地抵达餐桌。这些问题没有意识形态，只有正确答案与错误答案。科学技官主义者的使命，便是将权力从空谈者手中夺回，交还给那些真正懂得如何让系统运转的人。至于这个系统被称作民主还是专制，被贴上自由还是威权的标签，他们毫不在意，只要火车仍然准点——那就够了。"
 classical_socialism_desc:0 "在南极洲这片古老的大地上，若要生存，必须竭尽全力。面对低温严寒、永不散去的风暴、长达半年的黑暗，以及被文明世界所遗忘的境地，来自古代的文明智慧远比充满现代性的政治体制要顽强地多。\n\n古典社会主义围绕着对公民身份的划定建立了最适合南极空洞城市的社会体制，而对于一旦知晓了这里正在发生什么的人来说，也是最令他们感到不安的社会体制，其名号中的古典并非来自欧文与傅立叶那样的时代，也非马基雅维利与莫尔那样的时代，而是对苏格拉底与柏拉图那样的时代的致敬，如同那时唯有成年男性自由民才可称为公民一样，古典社会主义将自身公民的划定也只适用于“有能者”，在此之下者，则如尚有灵魂的人形。"
 lukashenko_thought_desc:0 ""
