 science_idea:0 ""
 society_idea:0 ""
 poverty_idea:0 ""


 proper_science_base:0 "发达的科研基础"
 proper_science_base_desc:0 "这个国家已经融入全球学术共同体，最新发明能够通过现代大学与研究机构迅速传播，本国也有能力产出重要成果。"
 big_science_base:0 "可观的科研基础"
 big_science_base_desc:0 "学者已经拥抱科学革命，但蒙昧思想、资源不足与人才短缺仍限制着大规模研究。"
 better_science_base:0 "小型科研基础"
 better_science_base_desc:0 "少数学者开始质疑传统观念并接触现代科学，但高等教育与研究机构依然数量稀少、规模有限。"
 poor_science_base:0 "贫弱的科研基础"
 poor_science_base_desc:0 "现代科学几乎无人知晓，迷信和传统知识主导着思想生活，系统性创新无从谈起。"

 modern_society:0 "现代社会"
 modern_society_desc:0 "这是一个制度健全、基础设施完善、彼此高度连接，并具备高效大规模工业生产能力的复杂社会。"
 outdated_industry:0 "新近工业化社会"
 outdated_industry_desc:0 "工业化正在重塑这个国家，但传统制度与尚不完整的基础设施仍使它落后于先进国家。"
 outdated_industry2:0 "新近工业化社会"
 outdated_industry2_desc:0 "$outdated_industry_desc$"
 pre_industrial_society:0 "工业化中的社会"
 pre_industrial_society_desc:0 "这个社会正经历工业革命，机械化、城市化与新式制度不断扩张，但转型尚未完成。"
 pre_industrial_society1:0 "工业化中的社会"
 pre_industrial_society1_desc:0 "$pre_industrial_society_desc$"
 pre_industrial_society2:0 "工业化中的社会"
 pre_industrial_society2_desc:0 "$pre_industrial_society_desc$"
 pre_industrial_society3:0 "工业化中的社会"
 pre_industrial_society3_desc:0 "$pre_industrial_society_desc$"
 agrarian_society:0 "农业社会"
 agrarian_society_desc:0 "绝大多数人口从事农业，生产主要依靠人力，传统制度支配着缓慢变化的乡村社会。"
 agrarian_society2:0 "农业社会"
 agrarian_society2_desc:0 "$agrarian_society_desc$"
 agrarian_society3:0 "农业社会"
 agrarian_society3_desc:0 "$agrarian_society_desc$"
 agrarian_society4:0 "农业社会"
 agrarian_society4_desc:0 "$agrarian_society_desc$"
 agrarian_society5:0 "农业社会"
 agrarian_society5_desc:0 "$agrarian_society_desc$"
 agrarian_society6:0 "农业社会"
 agrarian_society6_desc:0 "$agrarian_society_desc$"
 tribal_society:0 "原始社会"
 tribal_society_desc:0 "人口分散在众多小型共同体中，中央权威薄弱，劳动分工有限，经济以自给自足为主。"
 tribal_society2:0 "原始社会"
 tribal_society2_desc:0 "$tribal_society_desc$"
 tribal_society3:0 "原始社会"
 tribal_society3_desc:0 "$tribal_society_desc$"
 tribal_society4:0 "原始社会"
 tribal_society4_desc:0 "$tribal_society_desc$"
 communal_society:0 "公社社会"
 communal_society_desc:0 "一种组织简单而分散的社会，以相互依存、共享土地和资源为基础，领导者主要承担礼仪角色。"
 detached_country:0 "与世隔绝的国家"
 detached_country_desc:0 "这个国家几乎完全脱离外部世界，也缺乏现代国家应有的制度。"

 no_poverty:0 "贫困可忽略不计"
 no_poverty_desc:0 "贫困依然存在，但多数公民能够维持生计，明显比社会其他成员贫穷的人很少。"
 poverty5:0 "轻微贫困"
 poverty5_desc:0 "部分公民失去了维持生活的手段，只能依靠他人的救济。"
 poverty4:0 "较低贫困"
 poverty4_desc:0 "一个不可忽视的少数群体比大多数人贫穷，其中一些人不得不靠乞讨或犯罪生存。"
 poverty3:0 "中等贫困"
 poverty3_desc:0 "相当一部分人口无法稳定获得基本生活必需品，并被排斥在正常社会生活之外。"
 poverty2:0 "高度贫困"
 poverty2_desc:0 "大批赤贫人口住在贫民窟和破败乡舍中，无论怎样劳动也难以维持生计。"
 poverty1:0 "严重贫困"
 poverty1_desc:0 "普遍贫困影响着大多数人口，饥饿、人口流失与犯罪已经泛滥。"
 poverty:0 "极端贫困"
 poverty_desc:0 "近乎彻底的社会崩溃造成了极端贫困、农田荒废、市场萧条、人口外逃以及法律秩序瓦解。"
