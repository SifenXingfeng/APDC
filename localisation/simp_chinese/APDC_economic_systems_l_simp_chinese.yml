 APDC_economic_system_decentralized_planning_idea_desc:0 "§Y分散计划经济§!\n\n战略资源获取效率：§G+5.00%§!\n建设速度：§G+10.00%§!\n科研速度：§G+10.00%§!\n工厂产出：§G+10.00%§!\n海军船坞产出：§G+10.00%§!\n建造维护费：§R+10.0%§!\n军工生产维护费：§R+10.0%§!\n船坞生产维护费：§R+10.0%§!\n私营企业收购价格：§G-100%§!\n私营军工装备购买费用：§G-100%§!"
