 APDC_ECONOMIC_SYSTEM_TRADITIONAL_AGRICULTURE_TOOLTIP:0 "§Y传统农业经济§!\n§L生产主要由家庭农业、地方行会和低度商品交换构成。土地与劳动力充足，但资本积累、工业组织和技术扩散十分缓慢。§!\n\n§Y经济体制效果：§!\n生活消费品工厂系数：§R+25.0%§!\n工厂产出：§R-30.0%§!\n建造速度：§R-30.0%§!\n研究速度：§R-25.0%§!\n本地资源：§G+25.0%§!\n生产效率增长：§R-25.0%§!"
 APDC_ECONOMIC_SYSTEM_DEPENDENT_ECONOMY_TOOLTIP:0 "§Y依附型经济§!\n§L本国增长高度依赖外国资本、技术与出口市场。资源部门扩张迅速，但利润外流和产业链残缺限制了自主发展。§!\n\n§Y经济体制效果：§!\n生活消费品工厂系数：§R+15.0%§!\n工厂产出：§R-15.0%§!\n建造速度：§G+10.0%§!\n研究速度：§R-15.0%§!\n本地资源：§G+35.0%§!\n生产效率增长：§R-10.0%§!"
 APDC_ECONOMIC_SYSTEM_FREE_MARKET_TOOLTIP:0 "§Y自由市场经济§!\n§L私人产权、价格信号和企业竞争主导资源配置。创新与生产效率突出，但战略资源保障容易受到市场波动影响。§!\n\n§Y经济体制效果：§!\n生活消费品工厂系数：§G-15.0%§!\n工厂产出：§G+25.0%§!\n建造速度：§G+20.0%§!\n研究速度：§G+20.0%§!\n本地资源：§R-20.0%§!\n生产效率增长：§G+25.0%§!"
 APDC_ECONOMIC_SYSTEM_MIXED_MARKET_TOOLTIP:0 "§Y混合市场经济§!\n§L市场竞争与公共调节共同发挥作用。政府通过福利、监管和投资缓和周期波动，在效率与安全之间保持平衡。§!\n\n§Y经济体制效果：§!\n生活消费品工厂系数：§G-8.0%§!\n工厂产出：§G+15.0%§!\n建造速度：§G+15.0%§!\n研究速度：§G+12.0%§!\n本地资源：§G+8.0%§!\n生产效率增长：§G+12.0%§!"
 APDC_ECONOMIC_SYSTEM_STATE_GUIDED_TOOLTIP:0 "§Y国家指导经济§!\n§L企业仍以市场经营为主，但国家通过产业政策、信贷和长期规划引导投资，集中力量建设关键产业与基础设施。§!\n\n§Y经济体制效果：§!\n生活消费品工厂系数：§G-10.0%§!\n工厂产出：§G+20.0%§!\n建造速度：§G+30.0%§!\n研究速度：§G+10.0%§!\n本地资源：§G+18.0%§!\n生产效率增长：§G+8.0%§!"
 APDC_ECONOMIC_SYSTEM_STATE_CAPITALISM_TOOLTIP:0 "§Y国家资本主义§!\n§L国家以控股企业、主权资本和行政特许掌握经济命脉，同时保留市场交易，以国家目标统合资本扩张。§!\n\n§Y经济体制效果：§!\n生活消费品工厂系数：§G-12.0%§!\n工厂产出：§G+30.0%§!\n建造速度：§G+25.0%§!\n研究速度：§G+5.0%§!\n本地资源：§G+25.0%§!\n生产效率增长：§G+15.0%§!"
 APDC_ECONOMIC_SYSTEM_MARKET_SOCIALISM_TOOLTIP:0 "§Y市场社会主义§!\n§L社会或公共所有制构成经济基础，企业依据市场价格自主经营，并通过公共投资与再分配保证发展成果服务于社会。§!\n\n§Y经济体制效果：§!\n生活消费品工厂系数：§G-12.0%§!\n工厂产出：§G+22.0%§!\n建造速度：§G+18.0%§!\n研究速度：§G+15.0%§!\n本地资源：§G+12.0%§!\n生产效率增长：§G+18.0%§!"
 APDC_ECONOMIC_SYSTEM_DECENTRALIZED_PLANNING_TOOLTIP:0 "§Y分散计划经济§!\n§L全国目标由地方、行业和企业委员会分级落实。基层掌握较多决策权，资源动员广泛，但跨部门协调成本较高。§!\n\n§Y经济体制效果：§!\n生活消费品工厂系数：§G-15.0%§!\n工厂产出：§G+18.0%§!\n建造速度：§G+12.0%§!\n研究速度：§G+15.0%§!\n本地资源：§G+25.0%§!\n生产效率增长：§R-8.0%§!"
 APDC_ECONOMIC_SYSTEM_CENTRAL_PLANNING_TOOLTIP:0 "§Y中央计划经济§!\n§L中央机关通过统一计划配置投资、原料和产量。体制能够快速集中资源，却容易压缩创新空间并造成生产调整迟缓。§!\n\n§Y经济体制效果：§!\n生活消费品工厂系数：§G-20.0%§!\n工厂产出：§G+35.0%§!\n建造速度：§G+35.0%§!\n研究速度：§R-10.0%§!\n本地资源：§G+40.0%§!\n生产效率增长：§R-20.0%§!"
