 proper_science_base:0 "Developed Science Base"
 proper_science_base_desc:0 "This nation is part of the global community of intellectuals and scholars. The latest inventions spread quickly through its prestigious modern universities and research institutions."
 big_science_base:0 "Substantial Science Base"
 big_science_base_desc:0 "Scholars have embraced the scientific revolution, but obscurantism, limited resources and a shortage of personnel still prevent large-scale research."
 better_science_base:0 "Small Science Base"
 better_science_base_desc:0 "A small number of scholars question traditional ideas and study modern science, but institutions of higher education remain few and limited."
 poor_science_base:0 "Poor Science Base"
 poor_science_base_desc:0 "Modern science is barely known. Superstition and traditional knowledge dominate intellectual life, leaving little room for systematic innovation."

 modern_society:0 "Modern Society"
 modern_society_desc:0 "A complex, interconnected society with robust institutions, extensive infrastructure and efficient mass industrial production."
 outdated_industry:0 "Newly Industrialised Society"
 outdated_industry_desc:0 "Industrialisation is transforming the country, but traditional institutions and incomplete infrastructure still leave it behind advanced nations."
 outdated_industry2:0 "Newly Industrialised Society"
 outdated_industry2_desc:0 "$outdated_industry_desc$"
 pre_industrial_society:0 "Industrialising Society"
 pre_industrial_society_desc:0 "This society is undergoing an industrial revolution. Mechanisation, urbanisation and new institutions are spreading, though the transition remains incomplete."
 pre_industrial_society1:0 "Industrialising Society"
 pre_industrial_society1_desc:0 "$pre_industrial_society_desc$"
 pre_industrial_society2:0 "Industrialising Society"
 pre_industrial_society2_desc:0 "$pre_industrial_society_desc$"
 pre_industrial_society3:0 "Industrialising Society"
 pre_industrial_society3_desc:0 "$pre_industrial_society_desc$"
 agrarian_society:0 "Agrarian Society"
 agrarian_society_desc:0 "Most of the population works in agriculture, production is largely manual and traditional institutions dominate a slowly changing rural society."
 agrarian_society2:0 "Agrarian Society"
 agrarian_society2_desc:0 "$agrarian_society_desc$"
 agrarian_society3:0 "Agrarian Society"
 agrarian_society3_desc:0 "$agrarian_society_desc$"
 agrarian_society4:0 "Agrarian Society"
 agrarian_society4_desc:0 "$agrarian_society_desc$"
 agrarian_society5:0 "Agrarian Society"
 agrarian_society5_desc:0 "$agrarian_society_desc$"
 agrarian_society6:0 "Agrarian Society"
 agrarian_society6_desc:0 "$agrarian_society_desc$"
 tribal_society:0 "Primitive Society"
 tribal_society_desc:0 "The population is divided into many small communities with little central authority, limited specialisation and a subsistence economy."
 tribal_society2:0 "Primitive Society"
 tribal_society2_desc:0 "$tribal_society_desc$"
 tribal_society3:0 "Primitive Society"
 tribal_society3_desc:0 "$tribal_society_desc$"
 tribal_society4:0 "Primitive Society"
 tribal_society4_desc:0 "$tribal_society_desc$"
 communal_society:0 "Communal Society"
 communal_society_desc:0 "A simple and fragmented society built on interdependence, shared land and resources, and largely ceremonial leadership."
 detached_country:0 "Detached Country"
 detached_country_desc:0 "This country is almost entirely detached from the outside world and the institutions of a modern state."

 no_poverty:0 "Negligible Poverty"
 no_poverty_desc:0 "Poverty exists, but most citizens can support themselves and very few are noticeably poorer than the rest of society."
 poverty5:0 "Mild Poverty"
 poverty5_desc:0 "Some citizens have lost the means to support themselves and rely on the charity of others."
 poverty4:0 "Low Poverty"
 poverty4_desc:0 "A noticeable minority is poorer than most and some resort to begging or crime to survive."
 poverty3:0 "Moderate Poverty"
 poverty3_desc:0 "A sizeable part of the population lacks reliable access to basic needs and is excluded from normal social life."
 poverty2:0 "High Poverty"
 poverty2_desc:0 "Masses of destitute citizens live in slums and crumbling rural homes, unable to earn enough to get by."
 poverty1:0 "Severe Poverty"
 poverty1_desc:0 "Widespread poverty affects most of the population. Hunger, depopulation and crime are rampant."
 poverty:0 "Extreme Poverty"
 poverty_desc:0 "Near-total social collapse has produced extreme poverty, abandoned farms, empty markets, mass emigration and a breakdown of law and order."
